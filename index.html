<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>
  CreditGenie
</title>

<script
  src="https://telegram.org/js/telegram-web-app.js"
></script>


<style>

:root{
  --bg:#14212b;
  --panel:#17222b;
  --line:#2b3a46;
  --text:#f5f7f8;
  --muted:#8e98a1;
  --green:#49a627;
  --green2:#3e8f21;
  --blue:#2d7bdc;
  --blue2:#1f5fae;
  --input:#172029;
  --yellow:#d4a82f;
  --red:#c74b4b;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
  padding:18px 14px 40px;
}

.wrap{
  max-width:760px;
  margin:0 auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin:2px 2px 18px;
}

.logo{
  width:42px;
  height:42px;

  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      #63d73b,
      #308819
    );

  display:grid;
  place-items:center;

  font-size:24px;

  box-shadow:
    0 6px 18px #0005;
}

.brand h1{
  font-size:22px;
  margin:0;
}

.brand p{
  margin:2px 0 0;
  color:var(--muted);
  font-size:13px;
}

.card{
  background:var(--panel);

  border:
    1px solid var(--line);

  border-radius:18px;

  padding:
    20px 16px;

  margin-bottom:18px;
}

.card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.card-head h2{
  font-size:24px;
  line-height:1.1;
  margin:0;
}

.grid{
  display:grid;
  gap:13px;
}

input,
select{
  width:100%;
  height:58px;

  border:
    1px solid var(--line);

  border-radius:14px;

  background:var(--input);

  color:var(--text);

  padding:
    0 16px;

  font-size:18px;
  outline:none;
}

input::placeholder{
  color:#c9ced3;
}

.help{
  font-size:14px;
  color:var(--muted);
  line-height:1.5;
  margin:2px 0 0;
}

.actions{
  display:grid;
  gap:14px;
  margin-top:16px;
}

button{
  appearance:none;

  border:0;

  border-radius:13px;

  background:var(--green);

  color:white;

  padding:
    16px 26px;

  font-size:18px;
  font-weight:800;

  letter-spacing:.02em;

  box-shadow:
    0 6px 0 var(--green2);

  cursor:pointer;

  width:100%;
}

button:active{
  transform:
    translateY(2px);

  box-shadow:
    0 4px 0 var(--green2);
}

button:disabled{
  opacity:.55;
}

#openPeopleFinder{
  display:none;

  background:
    var(--blue);

  box-shadow:
    0 6px 0 var(--blue2);
}

#openPeopleFinder:active{
  box-shadow:
    0 4px 0 var(--blue2);
}

.status{
  margin-top:14px;

  color:
    var(--muted);

  font-size:14px;
}

.pill{
  font-size:12px;

  padding:
    5px 9px;

  border:
    1px solid var(--line);

  border-radius:
    999px;

  color:#cbd2d8;
}

.notice{
  font-size:12px;

  color:
    var(--muted);

  line-height:1.45;

  margin-top:14px;
}

.empty{
  color:
    var(--muted);
}

.request-item{
  padding:
    16px 0;

  border-bottom:
    1px solid var(--line);
}

.request-item:last-child{
  border-bottom:0;
}

.request-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
}

.row{
  color:#cbd2d8;

  margin-top:5px;

  font-size:14px;
}

.status-pill{
  border-radius:999px;

  padding:
    5px 9px;

  font-size:12px;

  border:
    1px solid var(--line);
}

.status-pill.pending{
  color:#f1c854;
}

.status-pill.completed{
  color:#62d95a;
}

.status-pill.rejected{
  color:#ff7979;
}

.result-text{
  margin-top:12px;

  padding:12px;

  border:
    1px solid var(--line);

  border-radius:12px;

  background:#141d24;

  color:#f1f4f6;

  white-space:
    pre-wrap;

  line-height:1.45;
}

.rejected-text{
  color:#ffaaaa;
}

#peopleFinderAdmin{
  display:none;

  margin-top:14px;

  padding:14px;

  border:
    1px solid var(--line);

  border-radius:12px;

  color:#cbd2d8;

  font-size:14px;
}


@media(min-width:700px){

  .grid.two{
    grid-template-columns:
      1fr 1fr;
  }

}

</style>

</head>


<body>


<div class="wrap">


<div class="brand">

  <div class="logo">
    🧞
  </div>

  <div>

    <h1>
      CreditGenie
    </h1>

    <p>
      Search request service
    </p>

  </div>

</div>


<section class="card">


<div class="card-head">

  <h2>
    SINGLE RECORD SEARCH
  </h2>

  <span
    class="pill"
    id="costPill"
  >
    Search
  </span>

</div>


<form id="searchForm">


<div class="grid">


<input
  id="firstName"
  placeholder="First Name"
  required
>


<input
  id="lastName"
  placeholder="Last Name"
  required
>


<div class="grid two">


<input
  id="state"
  maxlength="2"
  placeholder="State (2 letter)"
>


<select id="stateSelect">

<option value="">
  Select A State
</option>

<option>AL</option>
<option>AK</option>
<option>AZ</option>
<option>AR</option>
<option>CA</option>
<option>CO</option>
<option>CT</option>
<option>DE</option>
<option>FL</option>
<option>GA</option>
<option>HI</option>
<option>ID</option>
<option>IL</option>
<option>IN</option>
<option>IA</option>
<option>KS</option>
<option>KY</option>
<option>LA</option>
<option>ME</option>
<option>MD</option>
<option>MA</option>
<option>MI</option>
<option>MN</option>
<option>MS</option>
<option>MO</option>
<option>MT</option>
<option>NE</option>
<option>NV</option>
<option>NH</option>
<option>NJ</option>
<option>NM</option>
<option>NY</option>
<option>NC</option>
<option>ND</option>
<option>OH</option>
<option>OK</option>
<option>OR</option>
<option>PA</option>
<option>RI</option>
<option>SC</option>
<option>SD</option>
<option>TN</option>
<option>TX</option>
<option>UT</option>
<option>VT</option>
<option>VA</option>
<option>WA</option>
<option>WV</option>
<option>WI</option>
<option>WY</option>

</select>


</div>


<input
  id="city"
  placeholder="City"
>


<input
  id="zip"
  inputmode="numeric"
  placeholder="ZIP"
>


<input
  id="dob"
  placeholder="DOB (mm/dd/yyyy)"
>


<p class="help">

  Enter the search information
  and submit it to the admin queue.

</p>


</div>


<div class="actions">


<button
  id="searchBtn"
  type="submit"
>

  SUBMIT SEARCH

</button>


<button
  id="openPeopleFinder"
  type="button"
>

  RECONNECT PEOPLEFINDER

</button>


</div>


<div
  id="peopleFinderAdmin"
>

  PeopleFinder:
  Manual login / reconnect

</div>


<div
  id="status"
  class="status"
></div>


<p class="notice">

  Use only synthetic,
  authorized,
  or otherwise permitted information.

</p>


</form>


</section>


<section class="card">


<div class="card-head">


<h2>
  MY SEARCH REQUESTS
</h2>


<span
  class="pill"
  id="account"
></span>


</div>


<div id="requests">

  <div class="empty">
    Loading…
  </div>

</div>


</section>


</div>


<script>

const tg =
  window.Telegram?.WebApp;


if (tg) {

  tg.ready();

  tg.expand();

  try {

    tg.setHeaderColor(
      '#14212b'
    );

    tg.setBackgroundColor(
      '#14212b'
    );

  } catch (e) {}

}


const initData =
  tg?.initData || '';


const $ =
  id =>
    document.getElementById(id);


const headers =
  () => ({

    'Content-Type':
      'application/json',

    'X-Telegram-Init-Data':
      initData

  });


$('stateSelect')
.addEventListener(
  'change',
  e => {

    $('state').value =
      e.target.value;

  }
);


$('state')
.addEventListener(
  'input',
  e => {

    e.target.value =
      e.target.value
      .toUpperCase()
      .replace(
        /[^A-Z]/g,
        ''
      )
      .slice(
        0,
        2
      );


    $('stateSelect').value =
      e.target.value;

  }
);


async function api(
  path,
  options = {}
){

  const res =
    await fetch(
      path,
      {

        ...options,

        headers: {

          ...headers(),

          ...(
            options.headers
            ||
            {}
          )

        }

      }
    );


  const data =
    await res
    .json()
    .catch(
      () => ({})
    );


  if (!res.ok) {

    throw new Error(
      data.detail
      ||
      'Request failed'
    );

  }


  return data;

}


function esc(
  v = ''
){

  return String(v)
  .replace(
    /[&<>"']/g,
    s => ({

      '&':
        '&amp;',

      '<':
        '&lt;',

      '>':
        '&gt;',

      '"':
        '&quot;',

      "'":
        '&#39;'

    }[s])
  );

}


function prettyTime(
  value
){

  if (!value) {
    return '';
  }


  const d =
    new Date(
      value
    );


  if (
    Number.isNaN(
      d.getTime()
    )
  ){

    return value;

  }


  return d
    .toLocaleString();

}


function statusLabel(
  status
){

  if (
    status ===
    'completed'
  ){

    return 'Complete';

  }


  if (
    status ===
    'rejected'
  ){

    return 'Rejected';

  }


  return 'Pending';

}


async function loadMe(){

  try {

    const me =
      await api(
        '/api/me'
      );


    $('account')
    .textContent =

      me.first_name

      ? `Hi, ${me.first_name}`

      : '';


    $('costPill')
    .textContent =

      me.search_cost ===
      '$0.00'

      ? 'Free search'

      : `${me.search_cost} / search`;


    if (
      me.is_admin
    ){

      $('openPeopleFinder')
      .style.display =
        'block';


      $('peopleFinderAdmin')
      .style.display =
        'block';

    }

    else{

      $('openPeopleFinder')
      .style.display =
        'none';


      $('peopleFinderAdmin')
      .style.display =
        'none';

    }

  }

  catch(e){

    $('status')
    .textContent =
      e.message;

  }

}


async function loadRequests(){

  try {

    const rows =
      await api(
        '/api/requests'
      );


    if (
      !rows.length
    ){

      $('requests')
      .innerHTML =

        '<div class="empty">'
        +
        'No search requests yet.'
        +
        '</div>';

      return;

    }


    $('requests')
    .innerHTML =

      rows.map(
        r => {

          const location =
            [
              r.city,
              r.state,
              r.zip
            ]
            .filter(
              Boolean
            )
            .join(
              ', '
            );


          const result =

            r.status ===
            'completed'

            &&
            r.result_text

            ? `

            <div class="result-text">
              ${esc(r.result_text)}
            </div>

            `

            : '';


          const rejected =

            r.status ===
            'rejected'

            ? `

            <div
              class="
                result-text
                rejected-text
              "
            >

              ${
                esc(
                  r.admin_note
                  ||
                  'Request could not be completed.'
                )
              }

            </div>

            `

            : '';


          const waiting =

            r.status ===
            'pending'

            ? `

            <div class="row">
              Waiting for admin review…
            </div>

            `

            : '';


          return `

          <div class="request-item">


            <div class="request-top">


              <b>
                Request #${esc(r.id)}
              </b>


              <span
                class="
                  status-pill
                  ${esc(r.status)}
                "
              >

                ${
                  esc(
                    statusLabel(
                      r.status
                    )
                  )
                }

              </span>


            </div>


            <div class="row">

              <strong>

                ${
                  esc(
                    r.first_name
                  )
                }

                ${
                  esc(
                    r.last_name
                  )
                }

              </strong>

            </div>


            <div class="row">

              ${
                esc(
                  location
                  ||
                  'No location filters'
                )
              }

            </div>


            <div class="row">

              DOB:

              ${
                esc(
                  r.dob
                  ||
                  '—'
                )
              }

            </div>


            <div class="row">

              Submitted:

              ${
                esc(
                  prettyTime(
                    r.created_at
                  )
                )
              }

            </div>


            ${waiting}

            ${result}

            ${rejected}


          </div>

          `;

        }
      )
      .join('');

  }

  catch(e){

    $('requests')
    .innerHTML =

      `<div class="empty">

        ${esc(e.message)}

      </div>`;

  }

}


$('searchForm')
.addEventListener(
  'submit',

  async e => {


    e.preventDefault();


    const btn =
      $('searchBtn');


    btn.disabled =
      true;


    $('status')
    .textContent =

      'Submitting request…';


    const payload = {

      first_name:
        $('firstName')
        .value
        .trim(),

      last_name:
        $('lastName')
        .value
        .trim(),

      state:
        $('state')
        .value
        .trim(),

      city:
        $('city')
        .value
        .trim(),

      zip:
        $('zip')
        .value
        .trim(),

      dob:
        $('dob')
        .value
        .trim()

    };


    try {

      const data =
        await api(
          '/api/search',
          {

            method:
              'POST',

            body:
              JSON.stringify(
                payload
              )

          }
        );


      $('status')
      .textContent =

        `Request #${data.request_id} submitted. `
        +
        `Waiting for admin review.`;


      await loadRequests();

    }

    catch(err){

      $('status')
      .textContent =
        err.message;

    }

    finally{

      btn.disabled =
        false;

    }

  }
);


$('openPeopleFinder')
.addEventListener(
  'click',

  () => {

    const url =
      'https://peoplefinder.cc/';


    if (
      window.Telegram
      ?.WebApp
      ?.openLink
    ){

      window.Telegram
      .WebApp
      .openLink(
        url
      );

    }

    else{

      window.location.href =
        url;

    }

  }
);


loadMe();

loadRequests();


setInterval(
  loadRequests,
  5000
);

</script>


</body>

</html>
