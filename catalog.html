<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Previous character orders</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{font:16px system-ui;background:#14212b;color:#f5f7f8;max-width:700px;margin:40px auto;padding:20px}a{color:#98cbff}article{border:1px solid #354552;border-radius:12px;padding:20px;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><a href="/app">Back to CreditGenie</a><h1>Character catalog removed</h1><p>New requests and approvals are disabled. Previously saved records remain available below.</p><p id="status" role="status"></p><div id="orders"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();
async function load(){
 if(!tg?.initData)throw Error('Open this page from the CreditGenie Telegram Mini App to view saved records.');
 const response=await fetch('/api/catalog/orders',{headers:{'X-Telegram-Init-Data':tg.initData}});
 const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'Unable to load records.');
 document.getElementById('status').textContent=data.orders.length?'':'No previous character orders.';
 for(const order of data.orders){const card=document.createElement('article');const title=document.createElement('h2');title.textContent=order.character+' · Order #'+order.id;card.append(title);const status=document.createElement('p');status.textContent='Status: '+order.status+' · Charged: $'+(order.charged_cents/100).toFixed(2);card.append(status);if(order.status==='pending'){const note=document.createElement('p');note.textContent='This request is closed to approval. No charge will be made.';card.append(note);}if(order.player){const details=document.createElement('pre');details.textContent=Object.entries(order.player).map(([key,value])=>key+': '+value).join('\n');card.append(details);}document.getElementById('orders').append(card);}
}
load().catch(error=>document.getElementById('status').textContent=error.message);
</script></body></html>
